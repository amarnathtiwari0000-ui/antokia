<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EMI Calculator - Home Loan, Personal Loan EMI | Antokia</title>
<meta name="description" content="Free EMI Calculator for Home Loan, Personal Loan & Car Loan. Calculate monthly EMI, total interest and total payment instantly.">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-[#f5f5fa]">
<header class="bg-white shadow-sm"><div class="max-w-4xl mx-auto px-4 py-3 flex justify-between"><a href="/" class="text-2xl font-extrabold text-[#e5322d]">Antokia</a><a href="/" class="text-sm bg-gray-100 px-3 py-1 rounded-full">← Home</a></div></header>
<main class="max-w-4xl mx-auto px-4 py-6">
<div class="bg-white rounded-2xl shadow p-6 md:p-8">
<h1 class="text-2xl font-bold text-center"><i class="fa-solid fa-calculator text-blue-600"></i> EMI Calculator</h1>
<div class="grid md:grid-cols-2 gap-8 mt-8">
<div>
<label class="font-semibold text-sm">Loan Amount (₹)</label><input id="loan" type="number" value="2000000" class="border rounded-lg px-3 py-2 w-full mt-2">
<label class="font-semibold text-sm mt-4 block">Interest Rate (% p.a)</label><input id="rate" type="number" value="8.5" step="0.1" class="border rounded-lg px-3 py-2 w-full mt-2">
<label class="font-semibold text-sm mt-4 block">Loan Tenure (Years)</label><input id="tenure" type="number" value="20" class="border rounded-lg px-3 py-2 w-full mt-2">
<button onclick="calcEMI()" class="w-full bg-[#e5322d] text-white py-3 rounded-xl font-bold mt-6">Calculate EMI</button>
</div>
<div class="bg-[#f8fafc] rounded-xl p-6 text-center">
<p class="text-sm text-gray-500">Your Monthly EMI</p><h2 id="emiVal" class="text-3xl font-extrabold text-blue-600 mt-2">₹0</h2>
<div class="grid grid-cols-2 gap-3 mt-6"><div class="bg-white border rounded-xl p-3"><small class="text-gray-500">Total Interest</small><b id="intVal" class="block">₹0</b></div><div class="bg-white border rounded-xl p-3"><small class="text-gray-500">Total Payment</small><b id="totalPay" class="block">₹0</b></div></div>
</div>
</div>
</div>
</main>
<script>
function calcEMI(){let P=parseFloat(document.getElementById('loan').value), R=parseFloat(document.getElementById('rate').value)/12/100, N=parseFloat(document.getElementById('tenure').value)*12, EMI=P*R*Math.pow(1+R,N)/(Math.pow(1+R,N)-1), total=EMI*N; document.getElementById('emiVal').innerText='₹'+Math.round(EMI).toLocaleString('en-IN'); document.getElementById('intVal').innerText='₹'+Math.round(total-P).toLocaleString('en-IN'); document.getElementById('totalPay').innerText='₹'+Math.round(total).toLocaleString('en-IN');}
calcEMI();
</script>
</body>
</html>
