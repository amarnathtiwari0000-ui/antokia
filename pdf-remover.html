<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Remove PDF Pages - Free | Antokia</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf-lib/1.17.1/pdf-lib.min.js"></script>
</head>
<body class="bg-[#f5f5fa]">
<header class="bg-white shadow-sm">
<div class="max-w-3xl mx-auto px-4 py-3 flex justify-between">
<a href="/" class="font-extrabold text-[#e5322d] text-xl">Antokia</a>
<a href="/" class="text-sm underline">← All Tools</a>
</div>
</header>
<main class="max-w-3xl mx-auto px-4 py-8">
<h1 class="text-3xl font-bold text-center">Remove PDF Pages</h1>
<p class="text-center text-gray-500 text-sm mt-2">Delete pages from PDF - Free</p>
<div class="bg-gray-200 h-20 rounded-xl mt-6 flex items-center justify-center text-xs text-gray-500">Ad - Top</div>
<div class="bg-white rounded-2xl p-6 shadow border mt-6">
<input type="file" id="pdfInput" accept=".pdf" class="w-full border-2 border-dashed rounded-xl p-8">
<input type="text" id="pages" placeholder="e.g. 1,3,5 hatana hai toh likho" class="w-full border rounded-xl p-3 mt-4 text-sm">
<div id="info" class="mt-3 text-sm text-green-600 font-bold"></div>
<button id="removeBtn" class="mt-4 w-full bg-red-600 text-white py-4 rounded-xl font-bold">Remove Pages & Download</button>
</div>
<div class="bg-gray-200 h-20 rounded-xl mt-6 flex items-center justify-center text-xs text-gray-500">Ad - Bottom</div>
</main>
<script>
let pdfBytes=null, totalPages=0;
document.getElementById('pdfInput').addEventListener('change',async e=>{
let file=e.target.files[0];
pdfBytes=await file.arrayBuffer();
let pdf=await PDFLib.PDFDocument.load(pdfBytes);
totalPages=pdf.getPageCount();
document.getElementById('info').innerText="PDF me "+totalPages+" pages hai";
})
document.getElementById('removeBtn').onclick=async()=>{
if(!pdfBytes) return alert('PDF select karo Jane!');
let toRemove=document.getElementById('pages').value.split(',').map(n=>parseInt(n.trim())-1);
let pdf=await PDFLib.PDFDocument.load(pdfBytes);
let newPdf=await PDFLib.PDFDocument.create();
for(let i=0;i<pdf.getPageCount();i++){
if(!toRemove.includes(i)){
let [page]=await newPdf.copyPages(pdf,[i]);
newPdf.addPage(page);
}
}
let newBytes=await newPdf.save();
let blob=new Blob([newBytes],{type:"application/pdf"});
let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download="antokia-removed.pdf";a.click();
}
</script>
</body>
</html>
