<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>% Calculator - Percentage Calculator Free | Antokia</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f5f5fa]">
<header class="bg-white shadow-sm sticky top-0">
<div class="max-w-5xl mx-auto px-4 py-3 flex justify-between">
<a href="/" class="font-extrabold text-[#e5322d] text-xl">Antokia</a>
<a href="/" class="text-sm underline">← All Tools</a>
</div>
</header>
<main class="max-w-3xl mx-auto px-4 py-8">
<h1 class="text-3xl font-bold text-center">Percentage Calculator</h1>
<p class="text-center text-gray-500 text-sm mt-2">Fast % calculation - Free</p>
<div class="bg-gray-200 h-20 rounded-xl mt-6 flex items-center justify-center text-xs">Ad Top</div>

<div class="bg-white rounded-2xl p-6 shadow border mt-6 space-y-6">
<!-- Type 1 -->
<div class="bg-[#fafafa] p-4 rounded-xl">
<p class="text-sm font-bold">1. What is X% of Y?</p>
<div class="flex gap-2 mt-3">
<input id="p1" type="number" placeholder="%" class="w-1/3 border rounded-xl p-3 text-sm">
<input id="p2" type="number" placeholder="Value" class="w-2/3 border rounded-xl p-3 text-sm">
</div>
<button onclick="calc1()" class="mt-2 w-full bg-[#e5322d] text-white py-3 rounded-xl font-bold text-sm">Calculate</button>
<p id="r1" class="text-center font-bold mt-2 text-[#e5322d]"></p>
</div>
<!-- Type 2 -->
<div class="bg-[#fafafa] p-4 rounded-xl">
<p class="text-sm font-bold">2. X is what % of Y?</p>
<div class="flex gap-2 mt-3">
<input id="p3" type="number" placeholder="X" class="w-1/2 border rounded-xl p-3 text-sm">
<input id="p4" type="number" placeholder="Y" class="w-1/2 border rounded-xl p-3 text-sm">
</div>
<button onclick="calc2()" class="mt-2 w-full bg-black text-white py-3 rounded-xl font-bold text-sm">Calculate</button>
<p id="r2" class="text-center font-bold mt-2 text-black"></p>
</div>
<!-- Type 3 -->
<div class="bg-[#fafafa] p-4 rounded-xl">
<p class="text-sm font-bold">3. Discount Calculator</p>
<div class="flex gap-2 mt-3">
<input id="price" type="number" placeholder="Original Price" class="w-2/3 border rounded-xl p-3 text-sm">
<input id="disc" type="number" placeholder="Discount %" class="w-1/3 border rounded-xl p-3 text-sm">
</div>
<button onclick="calc3()" class="mt-2 w-full bg-green-600 text-white py-3 rounded-xl font-bold text-sm">Calculate Discount</button>
<p id="r3" class="text-center font-bold mt-2 text-green-600"></p>
</div>

</div>
<div class="bg-gray-200 h-20 rounded-xl mt-6 flex items-center justify-center text-xs">Ad Bottom</div>
</main>
<script>
function calc1(){
let a=parseFloat(document.getElementById('p1').value);
let b=parseFloat(document.getElementById('p2').value);
if(isNaN(a)||isNaN(b)) return;
document.getElementById('r1').innerText=(a*b/100)+" is answer";
}
function calc2(){
let a=parseFloat(document.getElementById('p3').value);
let b=parseFloat(document.getElementById('p4').value);
if(isNaN(a)||isNaN(b)||b==0) return;
document.getElementById('r2').innerText=((a/b)*100).toFixed(2)+"%";
}
function calc3(){
let p=parseFloat(document.getElementById('price').value);
let d=parseFloat(document.getElementById('disc').value);
if(isNaN(p)||isNaN(d)) return;
let save=p*d/100;
let final=p-save;
document.getElementById('r3').innerText="You Save ₹"+save.toFixed(2)+" | Pay ₹"+final.toFixed(2);
}
</script>
</body>
</html>
