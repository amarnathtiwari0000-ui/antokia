<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PDF to Word Converter - Free Online | Antokia</title>
<meta name="description" content="Convert PDF to Word DOCX free, no watermark, fast and secure.">
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://unpkg.com/docx@7.8.2/build/index.js"></script>
<style>
body{font-family:Inter,system-ui;background:#f8fafc;margin:0;padding:20px}
.container{max-width:700px;margin:30px auto;background:#fff;padding:30px;border-radius:16px;box-shadow:0 10px 30px rgba(0,0,0,.08)}
h1{text-align:center}
.drop{border:2px dashed #6366f1;padding:40px;text-align:center;border-radius:12px;cursor:pointer;background:#f5f3ff}
#status{margin-top:20px;text-align:center;font-weight:600}
button{background:#6366f1;color:#fff;border:0;padding:12px 20px;border-radius:8px;cursor:pointer;width:100%;margin-top:15px;font-size:16px}
button:disabled{opacity:.5}
</style>
</head>
<body>
<div class="container">
<h1>PDF to Word Converter</h1>
<p style="text-align:center;color:#666">100% Free, Secure, No Upload to Server</p>
<div class="drop" id="drop">
<span>📄 Click or Drag PDF Here</span>
<input type="file" id="file" accept=".pdf" hidden>
</div>
<div id="status"></div>
<button id="download" style="display:none">Download Word File (.docx)</button>
</div>
<script>
const fileInput=document.getElementById('file');
const drop=document.getElementById('drop');
const status=document.getElementById('status');
const dlBtn=document.getElementById('download');
let docxBlob=null;

drop.onclick=()=>fileInput.click();
drop.ondragover=e=>{e.preventDefault();drop.style.background='#e0e7ff'}
drop.ondrop=e=>{
 e.preventDefault();
 fileInput.files=e.dataTransfer.files;
 handleFile();
}
fileInput.onchange=handleFile;

async function handleFile(){
 const file=fileInput.files[0];
 if(!file) return;
 status.textContent="Reading PDF...";
 const reader=new FileReader();
 reader.onload=async function(){
   const typedarray=new Uint8Array(this.result);
   const pdf=await pdfjsLib.getDocument(typedarray).promise;
   let fullText="";
   for(let i=1;i<=pdf.numPages;i++){
     status.textContent=`Reading Page ${i}/${pdf.numPages}...`;
     const page=await pdf.getPage(i);
     const content=await page.getTextContent();
     const strings=content.items.map(item=>item.str).join(" ");
     fullText+=strings+"\n\n";
   }
   status.textContent="Creating Word file...";
   const doc=new docx.Document({
     sections:[{properties:{},children:fullText.split("\n").map(t=>new docx.Paragraph({children:[new docx.TextRun(t)]}))}]
   });
   const blob=await docx.Packer.toBlob(doc);
   docxBlob=blob;
   status.textContent=`Done! ${pdf.numPages} pages converted.`;
   dlBtn.style.display="block";
 }
 reader.readAsArrayBuffer(file);
}
dlBtn.onclick=()=>{
 if(!docxBlob) return;
 const a=document.createElement('a');
 a.href=URL.createObjectURL(docxBlob);
 a.download="converted.docx";
 a.click();
}
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
</script>
</body>
</html>
