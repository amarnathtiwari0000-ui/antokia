<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Background Remover - Person BG Remover Free | Antokia</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.10.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-pix@2.2.1/dist/body-pix.min.js"></script>
</head>
<body class="bg-[#f5f5fa]">
<header class="bg-white shadow-sm p-4 flex justify-between"><a href="/" class="font-extrabold text-[#e5322d] text-xl">Antokia</a><a href="/" class="text-sm underline">← All Tools</a></header>
<main class="max-w-3xl mx-auto px-4 py-6">
<h1 class="text-center text-2xl font-bold">Background Remover (Person)</h1>
<p class="text-center text-xs text-gray-500 mt-1">Best for Person Photos - 2 Sec - Free</p>
<div class="bg-white rounded-2xl p-6 shadow border mt-6">
<input type="file" id="file" accept="image/*" class="block w-full text-sm file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:bg-[#e5322d] file:text-white file:font-bold">
<p id="status" class="text-center text-sm mt-4 font-bold text-[#e5322d]">Loading AI... 5 sec wait</p>
<div id="box" class="hidden grid grid-cols-2 gap-4 mt-4">
<div><p class="text-xs font-bold">Original</p><img id="orig" class="rounded-xl border w-full"></div>
<div><p class="text-xs font-bold">Transparent</p><canvas id="canvas" class="rounded-xl border w-full bg-[url('https://i.imgur.com/8Km9tLL.png')]"></canvas></div>
</div>
<button id="dl" class="hidden w-full mt-4 bg-black text-white py-3 rounded-xl font-bold">Download Transparent PNG</button>
</div>
</main>
<script>
let net;
async function load(){ net = await bodyPix.load({architecture:'MobileNetV1', outputStride:16, multiplier:0.75}); document.getElementById('status').innerText='AI Ready! Upload Photo Now'; }
load();

document.getElementById('file').addEventListener('change', async (e)=>{
  const file=e.target.files[0]; if(!file) return;
  document.getElementById('box').classList.remove('hidden');
  document.getElementById('orig').src=URL.createObjectURL(file);
  document.getElementById('status').innerText='Removing Background...';
  const img=document.getElementById('orig');
  await new Promise(r=>img.onload=r);
  const seg=await net.segmentPerson(img, {internalResolution:'medium', segmentationThreshold:0.7});
  const canvas=document.getElementById('canvas');
  canvas.width=img.naturalWidth; canvas.height=img.naturalHeight;
  const ctx=canvas.getContext('2d');
  ctx.drawImage(img,0,0);
  const imgData=ctx.getImageData(0,0,canvas.width,canvas.height);
  for(let i=0;i<seg.data.length;i++){
    if(seg.data[i]==0) imgData.data[i*4+3]=0;
  }
  ctx.putImageData(imgData,0,0);
  document.getElementById('status').innerText='Done! ✓';
  document.getElementById('dl').classList.remove('hidden');
  document.getElementById('dl').onclick=()=>{ const a=document.createElement('a'); a.href=canvas.toDataURL('image/png'); a.download='antokia-no-bg.png'; a.click(); }
});
</script>
</body>
</html>
