<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Remove background from image free & HD. 100% free, no login, no watermark. Drag, drop & download. Best free BG remover.">
<title>HD Background Remover Free - Remove BG in 2 Sec | Antokia</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-pix@2.2.0/dist/body-pix.min.js"></script>
</head>
<body class="bg-[#f5f5fa]">
<header class="bg-white p-4 flex justify-between shadow-sm"><b class="text-[#e5322d]">Antokia</b><a href="/" class="text-sm underline">← All Tools</a></header>
<main class="max-w-3xl mx-auto p-4">
<h1 class="text-center text-2xl font-bold mt-4">BG Remover Pro</h1>
<div class="bg-white rounded-2xl p-6 shadow mt-6 border text-center">
<input type="file" id="file" accept="image/*" class="w-full text-sm file:mr-4 file:py-2 file:px-6 file:rounded-full file:border-0 file:bg-[#e5322d] file:text-white file:font-bold">
<p id="status" class="mt-4 text-sm font-bold text-[#e5322d]">AI Loading... 8 sec</p>

<div id="box" class="hidden mt-4">
<div class="grid grid-cols-2 gap-4">
<div><p class="text-xs font-bold mb-1">Original</p><img id="orig" class="rounded-xl border w-full"></div>
<div><p class="text-xs font-bold mb-1">Result</p><canvas id="canvas" class="rounded-xl border w-full"></canvas></div>
</div>

<div id="bgControls" class="hidden mt-6 text-left bg-gray-50 p-4 rounded-xl border">
<p class="font-bold text-sm mb-3">Change Background:</p>
<div class="flex gap-2 flex-wrap mb-4">
<button onclick="changeBg('transparent')" class="px-4 py-2 bg-white border rounded-full text-xs font-bold">Transparent</button>
<button onclick="changeBg('white')" class="px-4 py-2 bg-white border rounded-full text-xs font-bold">White</button>
<button onclick="changeBg('black')" class="px-4 py-2 bg-black text-white rounded-full text-xs font-bold">Black</button>
<button onclick="changeBg('blur')" class="px-4 py-2 bg-blue-600 text-white rounded-full text-xs font-bold">Blur</button>
<label class="px-4 py-2 bg-[#e5322d] text-white rounded-full text-xs font-bold cursor-pointer">Color <input type="color" id="colorPicker" value="#ff0000" class="hidden"></label>
<label class="px-4 py-2 bg-green-600 text-white rounded-full text-xs font-bold cursor-pointer">Image BG <input type="file" id="bgFile" accept="image/*" class="hidden"></label>
</div>

<div id="blurControl" class="hidden mb-4 bg-white p-3 rounded-lg border">
<label class="text-xs font-bold">Blur: <span id="blurVal">8</span>px (Kam-Zyada)</label>
<input type="range" id="blurSlider" min="1" max="20" value="8" class="w-full accent-blue-600">
</div>

<div class="border-t pt-3">
<p class="text-xs font-bold mb-2">Manual Edit + Back Button:</p>
<div class="flex gap-2 flex-wrap items-center">
<button onclick="undo()" class="px-4 py-2 bg-yellow-400 rounded-full text-xs font-bold">↩️ Back / Undo</button>
<button onclick="redo()" class="px-4 py-2 bg-white border rounded-full text-xs font-bold">↪️ Redo</button>
<button onclick="resetCut()" class="px-4 py-2 bg-gray-200 rounded-full text-xs font-bold">Reset</button>
</div>
<div class="flex gap-2 mt-3 items-center flex-wrap">
<button id="eraseBtn" onclick="setMode('erase')" class="px-3 py-1.5 bg-orange-500 text-white rounded-full text-xs">🧹 Erase BG</button>
<button id="restoreBtn" onclick="setMode('restore')" class="px-3 py-1.5 bg-white border rounded-full text-xs">✏️ Restore</button>
<button onclick="setMode('none')" class="px-3 py-1.5 bg-gray-200 rounded-full text-xs">View</button>
<input type="range" id="brushSize" min="5" max="60" value="25"><span class="text-xs">Size</span>
</div>
</div>
</div>

<div class="grid grid-cols-2 gap-3 mt-4">
<button id="dlTrans" class="hidden w-full bg-white border-2 border-black py-3 rounded-xl font-bold text-sm">Download Transparent PNG</button>
<button id="dl" class="hidden w-full bg-black text-white py-3 rounded-xl font-bold text-sm">Download With BG JPG</button>
</div>
</div>
</div>
</main>

<script>
let net, orig=document.getElementById('orig'), canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d'), status=document.getElementById('status');
let originalImg=null, personCutData=null, history=[], redoHistory=[], editMode='none', isDrawing=false, currentBg='transparent', lastSegmentation=null;

(async()=>{
  status.innerText='Loading Pro Cut AI... 8 sec first time';
  net=await bodyPix.load({architecture:'ResNet50', outputStride:16, quantBytes:2});
  status.innerText='Pro Ready! Photo upload karo - Kabhi error nahi ayega';
})();

document.getElementById('file').addEventListener('change', async(e)=>{
  const file=e.target.files[0]; if(!file) return;
  document.getElementById('box').classList.remove('hidden');
  orig.src=URL.createObjectURL(file);
  originalImg=new Image(); originalImg.src=orig.src;
  await new Promise(r=>orig.onload=r); await new Promise(r=>{ if(originalImg.complete) r(); else originalImg.onload=r; });

  canvas.width=orig.naturalWidth; canvas.height=orig.naturalHeight;
  status.innerText='Cutting... 3 sec';

  lastSegmentation=await net.segmentPerson(orig, {internalResolution:'full', segmentationThreshold:0.7});

  // High quality mask with smooth edge
  const maskCanvas=document.createElement('canvas'); maskCanvas.width=canvas.width; maskCanvas.height=canvas.height;
  const maskCtx=maskCanvas.getContext('2d');
  const segW=lastSegmentation.width, segH=lastSegmentation.height;
  const tempCanvas=document.createElement('canvas'); tempCanvas.width=segW; tempCanvas.height=segH;
  const tempCtx=tempCanvas.getContext('2d');
  const imgData=tempCtx.createImageData(segW, segH);
  for(let i=0;i<lastSegmentation.data.length;i++){ imgData.data[i*4+3]=lastSegmentation.data[i]?255:0; }
  tempCtx.putImageData(imgData,0,0);
  maskCtx.filter='blur(4px)'; maskCtx.drawImage(tempCanvas,0,0,canvas.width,canvas.height); maskCtx.filter='none';
  const finalMask=maskCtx.getImageData(0,0,canvas.width,canvas.height);

  ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(orig,0,0,canvas.width,canvas.height);
  const cutData=ctx.getImageData(0,0,canvas.width,canvas.height);
  for(let i=0;i<cutData.data.length/4;i++) cutData.data[i*4+3]=finalMask.data[i*4+3];
  ctx.putImageData(cutData,0,0);

  personCutData=cutData;
  saveHistory();
  document.getElementById('bgControls').classList.remove('hidden');
  document.getElementById('dl').classList.remove('hidden');
  document.getElementById('dlTrans').classList.remove('hidden');
  status.innerText='Done! ✓ Ab background badlo';
  currentBg='transparent';
});

function saveHistory(){ history.push(canvas.toDataURL()); if(history.length>20) history.shift(); redoHistory=[]; }
window.undo=()=>{ if(history.length<=1) return; redoHistory.push(history.pop()); let img=new Image(); img.src=history[history.length-1]; img.onload=()=>{ ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(img,0,0); }; }
window.redo=()=>{ if(!redoHistory.length) return; let data=redoHistory.pop(); history.push(data); let img=new Image(); img.src=data; img.onload=()=>{ ctx.clearRect(0,0,canvas.width,canvas.height); ctx.drawImage(img,0,0); }; }
window.resetCut=()=>{ if(!personCutData) return; ctx.putImageData(personCutData,0,0); saveHistory(); changeBg('transparent'); }

window.changeBg=(type,val)=>{
  currentBg=type; if(!personCutData) return;
  const blurPx=document.getElementById('blurSlider').value;
  ctx.clearRect(0,0,canvas.width,canvas.height);

  if(type==='white'){ ctx.fillStyle='#ffffff'; ctx.fillRect(0,0,canvas.width,canvas.height); }
  else if(type==='black'){ ctx.fillStyle='#000000'; ctx.fillRect(0,0,canvas.width,canvas.height); }
  else if(type==='color'){ ctx.fillStyle=val||document.getElementById('colorPicker').value; ctx.fillRect(0,0,canvas.width,canvas.height); }
  else if(type==='blur'){
    document.getElementById('blurControl').classList.remove('hidden');
    ctx.filter=`blur(${blurPx}px)`; ctx.drawImage(originalImg,0,0,canvas.width,canvas.height); ctx.filter='none';
  } else if(type==='imageBg'){ ctx.drawImage(val,0,0,canvas.width,canvas.height); }

  if(type==='transparent'){ ctx.putImageData(personCutData,0,0); }
  else {
    // Person ko background ke upar chipkao
    const temp=document.createElement('canvas'); temp.width=canvas.width; temp.height=canvas.height;
    temp.getContext('2d').putImageData(personCutData,0,0);
    ctx.drawImage(temp,0,0);
  }
}

document.getElementById('blurSlider').addEventListener('input', e=>{ document.getElementById('blurVal').innerText=e.target.value; if(currentBg==='blur') changeBg('blur'); });
document.getElementById('colorPicker').addEventListener('input', e=> changeBg('color', e.target.value));
document.getElementById('bgFile').addEventListener('change', e=>{ let img=new Image(); img.src=URL.createObjectURL(e.target.files[0]); img.onload=()=> changeBg('imageBg', img); });

window.setMode=(m)=>{ editMode=m; document.getElementById('eraseBtn').classList.toggle('ring-2',m==='erase'); document.getElementById('restoreBtn').classList.toggle('ring-2',m==='restore'); canvas.style.cursor=m==='none'?'default':'crosshair'; }
function getPos(e){ const rect=canvas.getBoundingClientRect(); const sx=canvas.width/rect.width, sy=canvas.height/rect.height; const x=(e.touches?e.touches[0].clientX:e.clientX)-rect.left, y=(e.touches?e.touches[0].clientY:e.clientY)-rect.top; return {x:x*sx, y:y*sy}; }
canvas.addEventListener('mousedown', e=>{ if(editMode==='none') return; isDrawing=true; draw(e); });
canvas.addEventListener('mousemove', e=>{ if(isDrawing) draw(e); });
window.addEventListener('mouseup', ()=>{ if(isDrawing){ isDrawing=false; saveHistory(); }});
canvas.addEventListener('touchstart', e=>{ if(editMode==='none') return; isDrawing=true; draw(e); e.preventDefault(); }, {passive:false});
canvas.addEventListener('touchmove', e=>{ if(isDrawing) draw(e); e.preventDefault(); }, {passive:false});
window.addEventListener('touchend', ()=>{ if(isDrawing){ isDrawing=false; saveHistory(); }});

function draw(e){
  const pos=getPos(e), size=document.getElementById('brushSize').value;
  if(editMode==='erase'){
    ctx.globalCompositeOperation='destination-out'; ctx.beginPath(); ctx.arc(pos.x,pos.y,size,0,Math.PI*2); ctx.fill(); ctx.globalCompositeOperation='source-over';
  } else if(editMode==='restore'){
    ctx.drawImage(originalImg, pos.x-size, pos.y-size, size*2, size*2, pos.x-size, pos.y-size, size*2, size*2);
  }
}

document.getElementById('dlTrans').onclick=()=>{
  const c=document.createElement('canvas'); c.width=canvas.width; c.height=canvas.height; c.getContext('2d').putImageData(personCutData,0,0);
  let a=document.createElement('a'); a.href=c.toDataURL('image/png'); a.download='transparent.png'; a.click();
};
document.getElementById('dl').onclick=()=>{
  let a=document.createElement('a'); a.href=canvas.toDataURL('image/jpeg',0.92); a.download='bg-change.jpg'; a.click();
};
</script>
</body>
</html>
