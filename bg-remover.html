<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BG Remover - Antokia</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.17.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/body-pix@2.2.0/dist/body-pix.min.js"></script>
</head>
<body class="bg-[#f5f5fa]">
<header class="bg-white p-4 flex justify-between shadow-sm"><a href="/" class="font-bold text-[#e5322d]">Antokia</a><a href="/" class="text-sm underline">← All Tools</a></header>
<main class="max-w-3xl mx-auto p-4">
<h1 class="text-center text-2xl font-bold mt-4">Background Remover</h1>
<p class="text-center text-xs text-gray-500">Pro Cut - No Head Cut</p>
<div class="bg-white rounded-2xl p-6 shadow mt-6 border text-center">
<input type="file" id="file" accept="image/*" class="w-full text-sm file:mr-4 file:py-2 file:px-6 file:rounded-full file:border-0 file:bg-[#e5322d] file:text-white file:font-bold">
<p id="status" class="mt-4 text-sm font-bold text-[#e5322d]">Loading Pro Cut AI... 10 sec</p>
<div id="box" class="hidden grid grid-cols-2 gap-4 mt-4">
<div><p class="text-xs font-bold mb-1">Original</p><img id="orig" class="rounded-xl border w-full"></div>
<div><p class="text-xs font-bold mb-1">Transparent</p><canvas id="canvas" class="rounded-xl border w-full" style="background-image: linear-gradient(45deg, #eee 25%, transparent 25%), linear-gradient(-45deg, #eee 25%, transparent 25%), linear-gradient(45deg, transparent 75%, #eee 75%), linear-gradient(-45deg, transparent 75%, #eee 75%); background-size: 20px 20px;"></canvas></div>
</div>
<button id="dl" class="hidden w-full mt-4 bg-black text-white py-3 rounded-xl font-bold">Download Transparent PNG</button>
</div>
</main>

<script>
const status = document.getElementById('status');
const orig = document.getElementById('orig');
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const dlBtn = document.getElementById('dl');
let net = null;

(async ()=>{
  status.innerText = 'Loading Pro Cut AI... Please wait 10 sec';
  net = await bodyPix.load({
    architecture: 'ResNet50',
    outputStride: 16,
    quantBytes: 4
  });
  status.innerText = 'Pro Cut Ready! Upload Photo';
})();

document.getElementById('file').addEventListener('change', async(e)=>{
  const file = e.target.files[0]; if(!file) return;
  document.getElementById('box').classList.remove('hidden');
  orig.src = URL.createObjectURL(file);
  await new Promise(r=>orig.onload=r);

  canvas.width = orig.naturalWidth;
  canvas.height = orig.naturalHeight;
  status.innerText = 'Cutting... High Quality';
  dlBtn.classList.add('hidden');

  const segmentation = await net.segmentPerson(orig, {
    flipHorizontal: false,
    internalResolution: 'full',
    segmentationThreshold: 0.5
  });

  // Better edge handling
  const personMask = bodyPix.toMask(segmentation, {r:0,g:0,b:0,a:0}, {r:0,g:0,b:0,a:255}, true);

  // Create high-res mask canvas
  const maskCanvas = document.createElement('canvas');
  maskCanvas.width = canvas.width;
  maskCanvas.height = canvas.height;
  const maskCtx = maskCanvas.getContext('2d');

  // Draw segmentation to mask with blur for smooth edges
  const segCanvas = document.createElement('canvas');
  segCanvas.width = segmentation.width;
  segCanvas.height = segmentation.height;
  const segCtx = segCanvas.getContext('2d');
  const segImageData = segCtx.createImageData(segmentation.width, segmentation.height);
  for(let i=0; i < segmentation.data.length; i++){
    segImageData.data[i*4] = 0;
    segImageData.data[i*4+1] = 0;
    segImageData.data[i*4+2] = 0;
    segImageData.data[i*4+3] = segmentation.data[i]? 255 : 0;
  }
  segCtx.putImageData(segImageData, 0,0);
  // Smooth edges
  maskCtx.filter = 'blur(2px)';
  maskCtx.drawImage(segCanvas, 0,0, canvas.width, canvas.height);
  maskCtx.filter = 'none';

  const finalMask = maskCtx.getImageData(0,0,canvas.width, canvas.height);

  ctx.clearRect(0,0,canvas.width, canvas.height);
  ctx.drawImage(orig, 0,0, canvas.width, canvas.height);
  const imgData = ctx.getImageData(0,0,canvas.width, canvas.height);

  for(let i=0; i < imgData.data.length/4; i++){
    imgData.data[i*4+3] = finalMask.data[i*4+3];
  }
  ctx.putImageData(imgData, 0,0);

  status.innerText = 'Done! ✓';
  dlBtn.classList.remove('hidden');
});

dlBtn.onclick = ()=>{
  const a = document.createElement('a');
  a.href = canvas.toDataURL('image/png');
  a.download = 'antokia-no-bg.png';
  a.click();
}
</script>
</body>
</html>
